<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Control Nutricional & Menú Semanal</title>
  <meta name="theme-color" content="#2f7d4f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header>
    <h1>Control Nutricional & Menú Semanal</h1>
    <nav class="tabs" role="tablist">
      <button data-t="a" class="tab-btn on" role="tab" aria-selected="true">Semana</button>
      <button data-t="b" class="tab-btn" role="tab" aria-selected="false">Compra</button>
      <button data-t="c" class="tab-btn" role="tab" aria-selected="false">Platos</button>
      <button data-t="d" class="tab-btn" role="tab" aria-selected="false">Ajustes</button>
    </nav>
  </header>

  <main>
    <!-- TAB 1: SEMANA -->
    <section id="ta" class="panel on" role="tabpanel">
      <div class="actions">
        <button class="btn s" id="btn-adjust">⚖️ Ajustar Raciones a Objetivos</button>
        <button class="btn s" id="open-menu-modal">📋 Ver Menú Semanal Completo</button>
        <button class="btn r x" id="clr">Vaciar</button>
      </div>

      <div class="grid" id="wk"></div>
      <div class="card" id="wk-sum" style="margin-top:16px;"></div>
    </section>

    <!-- TAB 2: COMPRA -->
    <section id="tb" class="panel" role="tabpanel">
      <div class="actions">
        <button class="btn s" id="cp">Copiar lista</button>
        <button class="btn r" id="un">Desmarcar todo</button>
      </div>
      <div id="shop"></div>
    </section>

    <!-- TAB 3: PLATOS -->
    <section id="tc" class="panel" role="tabpanel">
      <div class="card mb-3">
        <h3 id="form-dish-title">Nuevo / Editar plato</h3>
        <label for="dn">Nombre del plato</label>
        <input type="text" id="dn" placeholder="Ej. Bowl proteico de frutas">

        <label for="dt">Tipo de plato</label>
        <select id="dt">
          <option value="desayuno">Desayuno</option>
          <option value="almuerzo">Almuerzo (Media Mañana)</option>
          <option value="comida">Comida</option>
          <option value="merienda">Merienda (Tarde)</option>
          <option value="cena">Cena</option>
        </select>

        <h4>Ingredientes</h4>
        <div id="ing-list"></div>
        <button class="btn s my-1" id="ar">+ Añadir ingrediente</button>

        <div class="actions mt-2">
          <button class="btn" id="ds">Guardar plato</button>
          <button class="btn s" id="xc" style="display:none">Cancelar</button>
        </div>
      </div>
      <div id="dish-list"></div>
    </section>

    <!-- TAB 4: AJUSTES -->
    <section id="td" class="panel" role="tabpanel">
      <div class="card mb-3">
        <h3>Objetivos Nutricionales Diarios</h3>
        <div class="grid-2">
          <div><label for="tk">Calorías (kcal)</label><input type="number" id="tk" min="1000" max="5000"></div>
          <div><label for="tp">Proteína (g)</label><input type="number" id="tp" min="20" max="400"></div>
          <div><label for="tg">Grasas (g)</label><input type="number" id="tg" min="10" max="200"></div>
          <div><label for="th">Carbohidratos (g)</label><input type="number" id="th" min="20" max="600"></div>
          <div><label for="tgs">Grasa saturada máx (g)</label><input type="number" id="tgs" min="5" max="100"></div>
          <div><label for="taz">Azúcar máx (g)</label><input type="number" id="taz" min="5" max="150"></div>
          <div><label for="tfb">Fibra mín (g)</label><input type="number" id="tfb" min="5" max="100"></div>
          <div><label for="tm">Margen tolerancia (±%)</label><input type="number" id="tm" min="1" max="25"></div>
        </div>
      </div>

      <div class="card mb-3">
        <h3>Base de Alimentos</h3>
        <div class="grid-2">
          <div><label for="fn">Nombre</label><input type="text" id="fn"></div>
          <div><label for="fc">Categoría</label><input type="text" id="fc"></div>
          <div><label for="fk">Kcal / 100g</label><input type="number" id="fk"></div>
          <div><label for="fp">Proteína (g)</label><input type="number" id="fp"></div>
          <div><label for="fg">Grasa (g)</label><input type="number" id="fg"></div>
          <div><label for="fgs">Grasa sat. (g)</label><input type="number" id="fgs"></div>
          <div><label for="fh">Hidratos (g)</label><input type="number" id="fh"></div>
          <div><label for="faz">Azúcar (g)</label><input type="number" id="faz"></div>
          <div><label for="ffb">Fibra (g)</label><input type="number" id="ffb"></div>
          <div><label for="fu">Peso ud. (g, opc.)</label><input type="number" id="fu"></div>
          <div><label for="fun">Nombre ud. (opc.)</label><input type="text" id="fun"></div>
        </div>
        <button class="btn mt-2" id="fs">Guardar alimento</button>
      </div>

      <div class="card">
        <h3>Copia de Seguridad</h3>
        <div class="actions">
          <button class="btn" id="bd">⬇️ Descargar copia</button>
          <button class="btn s" id="bi">⬆️ Importar copia</button>
          <input type="file" id="fi" accept=".json" style="display:none">
        </div>
        <button class="btn r w-100" id="rs" style="margin-top:12px;">Restablecer datos por defecto</button>
      </div>
    </section>
  </main>

  <dialog id="menu-modal" class="modal">
    <div class="modal-header">
      <h2>Menú Semanal Completo</h2>
      <button class="btn r x" id="close-menu-modal">✕</button>
    </div>
    <div class="modal-body" id="menu-modal-content"></div>
    <div class="modal-footer">
      <button class="btn s" onclick="window.print()">🖨️ Imprimir / Guardar PDF</button>
      <button class="btn" id="close-menu-modal-btn">Cerrar</button>
    </div>
  </dialog>

  <script type="module" src="js/app.js"><\/script>
</body>
</html>
